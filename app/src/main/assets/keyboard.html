<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teclado Customizado</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #161213;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .keyboard-container {
      background-color: #161213;
      padding: 6px 4px 10px 4px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
    }

    .toolbar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 4px 0 8px 0;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: #d1c4c6;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .extension-panel {
      display: none;
      background-color: #241718;
      border-radius: 10px;
      padding: 8px;
      margin-bottom: 6px;
    }

    .extension-panel.active {
      display: flex;
    }

    .emoji-list {
      display: flex;
      gap: 12px;
      font-size: 22px;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 4px;
    }

    .emoji-item {
      cursor: pointer;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 6px;
      width: 100%;
    }

    .key {
      background-color: #382526;
      color: #f1e9ea;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      height: 46px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }

    .key:active {
      background-color: #523537;
    }

    .key svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .key-shift, .key-backspace {
      flex: 1.4;
      background-color: #2b1c1d;
    }

    .key-symbol {
      flex: 1.5;
      background-color: #2b1c1d;
      font-size: 15px;
      font-weight: 600;
    }

    .key-space {
      flex: 4.5;
      font-size: 13px;
      color: #d8c8ca;
    }

    .key-enter {
      flex: 1.4;
      background-color: #2b1c1d;
    }

    .key-shift.active {
      background-color: #ffffff;
      color: #161213;
    }

    .key-shift.active svg {
      fill: #161213;
    }
  </style>
</head>
<body>

  <div class="keyboard-container">
    
    <div class="toolbar">
      <button class="tool-btn" id="btn-emoji"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg></button>
      <button class="tool-btn"><svg viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg></button>
      <button class="tool-btn"><svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4 1.16 13.28 0 12 0S9.6.16 9.18 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg></button>
      <button class="tool-btn"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
    </div>

    <div class="extension-panel" id="emoji-panel">
      <div class="emoji-list">
        <span class="emoji-item" onclick="sendChar('😀')">😀</span>
        <span class="emoji-item" onclick="sendChar('😂')">😂</span>
        <span class="emoji-item" onclick="sendChar('😍')">😍</span>
        <span class="emoji-item" onclick="sendChar('👍')">👍</span>
        <span class="emoji-item" onclick="sendChar('🔥')">🔥</span>
        <span class="emoji-item" onclick="sendChar('🎉')">🎉</span>
        <span class="emoji-item" onclick="sendChar('❤️')">❤️</span>
        <span class="emoji-item" onclick="sendChar('😎')">😎</span>
      </div>
    </div>

    <div class="keyboard-row">
      <button class="key" onclick="sendChar('1')">1</button>
      <button class="key" onclick="sendChar('2')">2</button>
      <button class="key" onclick="sendChar('3')">3</button>
      <button class="key" onclick="sendChar('4')">4</button>
      <button class="key" onclick="sendChar('5')">5</button>
      <button class="key" onclick="sendChar('6')">6</button>
      <button class="key" onclick="sendChar('7')">7</button>
      <button class="key" onclick="sendChar('8')">8</button>
      <button class="key" onclick="sendChar('9')">9</button>
      <button class="key" onclick="sendChar('0')">0</button>
    </div>

    <div id="dynamic-rows"></div>

    <div class="keyboard-row">
      <button class="key key-symbol" id="btn-toggle-symbols" onclick="toggleSymbols()">!#1</button>
      <button class="key" onclick="sendChar(',')">,</button>
      <button class="key key-space" onclick="sendChar(' ')">Português (BR)</button>
      <button class="key" onclick="sendChar('.')">.</button>
      <button class="key key-enter" onclick="sendEnter()">
        <svg viewBox="0 0 24 24"><path d="M19 7v4H5.83l3.58-3.59L8 6l-6 6 6 6 1.41-1.41L5.83 13H21V7h-2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    let isShiftActive = false;
    let isSymbolsActive = false;

    const letterLayout = [
      ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
      ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'],
      ['shift', 'z', 'x', 'c', 'v', 'b', 'n', 'm', 'backspace']
    ];

    const symbolLayout = [
      ['@', '#', '$', '%', '&', '-', '+', '(', ')', '/'],
      ['*', '"', "'", ':', ';', '!', '?', '\\', '~'],
      ['shift', ',', '<', '>', '=', '[', ']', '{', '}', 'backspace']
    ];

    function sendChar(char) {
      if (window.AndroidKeyboard) {
        window.AndroidKeyboard.sendChar(char);
      }
      if (isShiftActive && !isSymbolsActive) {
        isShiftActive = false;
        renderDynamicRows();
      }
    }

    function deleteChar() {
      if (window.AndroidKeyboard) {
        window.AndroidKeyboard.deleteChar();
      }
    }

    function sendEnter() {
      if (window.AndroidKeyboard) {
        window.AndroidKeyboard.sendEnter();
      }
    }

    function renderDynamicRows() {
      const container = document.getElementById('dynamic-rows');
      container.innerHTML = '';
      const currentLayout = isSymbolsActive ? symbolLayout : letterLayout;

      currentLayout.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'keyboard-row';

        row.forEach(keyVal => {
          const button = document.createElement('button');

          if (keyVal === 'shift') {
            button.className = `key key-shift ${isShiftActive ? 'active' : ''}`;
            button.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 4L4 12h5v8h6v-8h5L12 4z"/></svg>`;
            button.onclick = () => { isShiftActive = !isShiftActive; renderDynamicRows(); };
          } else if (keyVal === 'backspace') {
            button.className = 'key key-backspace';
            button.innerHTML = `<svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>`;
            button.onclick = deleteChar;
          } else {
            button.className = 'key';
            const charToShow = isShiftActive && !isSymbolsActive ? keyVal.toUpperCase() : keyVal;
            button.textContent = charToShow;
            button.onclick = () => sendChar(charToShow);
          }

          rowDiv.appendChild(button);
        });

        container.appendChild(rowDiv);
      });
    }

    function toggleSymbols() {
      isSymbolsActive = !isSymbolsActive;
      document.getElementById('btn-toggle-symbols').textContent = isSymbolsActive ? 'ABC' : '!#1';
      renderDynamicRows();
    }

    document.getElementById('btn-emoji').onclick = () => {
      document.getElementById('emoji-panel').classList.toggle('active');
    };

    renderDynamicRows();
  </script>
</body>
</html>
